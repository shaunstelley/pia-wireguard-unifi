# The watchdog's own DNS servers, mounted over /etc/resolv.conf for its service only.
# Public servers, not the router: when the tunnel is down, the router's DNS can go
# down with it, and the watchdog needs to look up PIA's and Gmail's servers to fix it.
nameserver 1.1.1.1
nameserver 8.8.8.8
options timeout:3 attempts:2
